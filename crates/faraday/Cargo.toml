[package]
name = "faraday"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# Le navigateur embarque un processus principal (`faraday`) et un processus
# helper (`faraday_helper`) pour le multi-processus CEF, comme l'exemple
# officiel `cefsimple` de cef-rs.
[[bin]]
name = "faraday"
path = "src/main.rs"

[[bin]]
name = "faraday_helper"
path = "src/bin/faraday_helper.rs"

[features]
# En Phase 0, on désactive le sandbox par défaut (il nécessite bootstrap.exe).
# On le réactivera pour la production (Phase 4/5).
default = []
sandbox = ["cef/sandbox"]

# Métadonnées utilisées par l'outil `bundle-cef-app` (qui regroupe les binaires CEF).
[package.metadata.cef.bundle]
helper_name = "faraday_helper"
resources_path = "resources"

[dependencies]
cef = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
toml = "0.8"
serde_json = "1"
# UI chrome + rendu OSR de la page
eframe = "0.31"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"
